<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>8-Bit Beat Maker V2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 850px;
            background: #1b1b1b;
            border: 3px solid #444;
            border-radius: 15px;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #00e5ff;
            letter-spacing: 3px;
            margin-top: 0;
        }

        .controls {
            text-align: center;
            margin: 25px 0;
        }

        button {
            background: #00e5ff;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-family: monospace;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .bpm {
            text-align: center;
            margin-bottom: 30px;
        }

        input {
            width: 180px;
        }

        .sequencer {
            width: 100%;
        }

        .row {
            display: grid;
            grid-template-columns: 100px repeat(8, 1fr);
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }

        .name {
            font-size: 14px;
            text-align: right;
            padding-right: 5px;
        }

        .cube {
            height: 50px;
            background: #292929;
            border: 2px solid #444;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.08s;
        }

        .cube.active {
            background: #00e5ff;
            border-color: white;
            box-shadow: 0 0 12px #00e5ff;
        }

        .cube.playing {
            outline: 3px solid white;
            transform: scale(1.08);
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .app {
                padding: 15px;
            }

            h1 {
                font-size: 20px;
            }

            .row {
                grid-template-columns: 70px repeat(8, 1fr);
                gap: 5px;
            }

            .cube {
                height: 42px;
            }

            .name {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🎮 8-BIT BEAT MAKER</h1>

    <div class="controls">
        <button id="playButton">▶ PLAY</button>
    </div>

    <div class="bpm">
        BPM:
        <input
            type="range"
            id="bpm"
            min="60"
            max="180"
            value="120"
        >

        <span id="bpmValue">120</span>
    </div>

    <div class="sequencer">

        <!-- KICK -->

        <div class="row">

            <div class="name">KICK</div>

            <div class="cube" data-instrument="kick" data-step="0"></div>
            <div class="cube" data-instrument="kick" data-step="1"></div>
            <div class="cube" data-instrument="kick" data-step="2"></div>
            <div class="cube" data-instrument="kick" data-step="3"></div>
            <div class="cube" data-instrument="kick" data-step="4"></div>
            <div class="cube" data-instrument="kick" data-step="5"></div>
            <div class="cube" data-instrument="kick" data-step="6"></div>
            <div class="cube" data-instrument="kick" data-step="7"></div>

        </div>

        <!-- SNARE -->

        <div class="row">

            <div class="name">SNARE</div>

            <div class="cube" data-instrument="snare" data-step="0"></div>
            <div class="cube" data-instrument="snare" data-step="1"></div>
            <div class="cube" data-instrument="snare" data-step="2"></div>
            <div class="cube" data-instrument="snare" data-step="3"></div>
            <div class="cube" data-instrument="snare" data-step="4"></div>
            <div class="cube" data-instrument="snare" data-step="5"></div>
            <div class="cube" data-instrument="snare" data-step="6"></div>
            <div class="cube" data-instrument="snare" data-step="7"></div>

        </div>

        <!-- HI HAT -->

        <div class="row">

            <div class="name">HI-HAT</div>

            <div class="cube" data-instrument="hihat" data-step="0"></div>
            <div class="cube" data-instrument="hihat" data-step="1"></div>
            <div class="cube" data-instrument="hihat" data-step="2"></div>
            <div class="cube" data-instrument="hihat" data-step="3"></div>
            <div class="cube" data-instrument="hihat" data-step="4"></div>
            <div class="cube" data-instrument="hihat" data-step="5"></div>
            <div class="cube" data-instrument="hihat" data-step="6"></div>
            <div class="cube" data-instrument="hihat" data-step="7"></div>

        </div>

    </div>

    <div class="footer">
        ✦ MAKE A TINY BEAT ✦
    </div>

</div>


<script>

let audioContext;

let playing = false;

let currentStep = 0;

let timer = null;


const pattern = {

    kick: Array(8).fill(false),

    snare: Array(8).fill(false),

    hihat: Array(8).fill(false)

};


const cubes = document.querySelectorAll(".cube");

const playButton = document.getElementById("playButton");

const bpmSlider = document.getElementById("bpm");

const bpmValue = document.getElementById("bpmValue");


/* AUDIO */

function getAudio() {

    if (!audioContext) {

        audioContext = new AudioContext();

    }

    if (audioContext.state === "suspended") {

        audioContext.resume();

    }

    return audioContext;

}


/* KICK */

function kick() {

    const ctx = getAudio();

    const oscillator = ctx.createOscillator();

    const gain = ctx.createGain();

    oscillator.type = "square";

    oscillator.frequency.setValueAtTime(
        140,
        ctx.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        50,
        ctx.currentTime + 0.12
    );

    gain.gain.setValueAtTime(
        0.5,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.01,
        ctx.currentTime + 0.15
    );

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
        ctx.currentTime + 0.15
    );

}


/* SNARE */

function snare() {

    const ctx = getAudio();

    const oscillator = ctx.createOscillator();

    const gain = ctx.createGain();

    oscillator.type = "square";

    oscillator.frequency.value = 180;

    gain.gain.setValueAtTime(
        0.3,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.01,
        ctx.currentTime + 0.1
    );

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
        ctx.currentTime + 0.1
    );

}


/* HI HAT */

function hihat() {

    const ctx = getAudio();

    const oscillator = ctx.createOscillator();

    const gain = ctx.createGain();

    oscillator.type = "square";

    oscillator.frequency.value = 700;

    gain.gain.setValueAtTime(
        0.15,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.01,
        ctx.currentTime + 0.04
    );

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
        ctx.currentTime + 0.04
    );

}


/* CUBE CLICKING */

cubes.forEach(cube => {

    cube.addEventListener("click", () => {

        const instrument =
            cube.dataset.instrument;

        const step =
            Number(cube.dataset.step);

        pattern[instrument][step] =
            !pattern[instrument][step];

        cube.classList.toggle(
            "active"
        );

        if (
            pattern[instrument][step]
        ) {

            if (instrument === "kick") {
                kick();
            }

            if (instrument === "snare") {
                snare();
            }

            if (instrument === "hihat") {
                hihat();
            }

        }

    });

});


/* PLAY ONE STEP */

function playStep() {

    cubes.forEach(cube => {

        cube.classList.remove(
            "playing"
        );

    });


    document
        .querySelectorAll(
            `[data-step="${currentStep}"]`
        )
        .forEach(cube => {

            cube.classList.add(
                "playing"
            );

        });


    if (
        pattern.kick[currentStep]
    ) {
        kick();
    }


    if (
        pattern.snare[currentStep]
    ) {
        snare();
    }


    if (
        pattern.hihat[currentStep]
    ) {
        hihat();
    }


    currentStep++;

    if (currentStep >= 8) {

        currentStep = 0;

    }

}


/* START */

function startSequencer() {

    const bpm =
        Number(bpmSlider.value);

    const interval =
        (60 / bpm) * 500;

    playStep();

    timer = setInterval(
        playStep,
        interval
    );

}


/* PLAY BUTTON */

playButton.addEventListener(
    "click",
    () => {

        getAudio();

        if (!playing) {

            playing = true;

            currentStep = 0;

            playButton.textContent =
                "■ STOP";

            startSequencer();

        }

        else {

            playing = false;

            clearInterval(timer);

            timer = null;

            playButton.textContent =
                "▶ PLAY";

            cubes.forEach(cube => {

                cube.classList.remove(
                    "playing"
                );

            });

        }

    }
);


/* BPM */

bpmSlider.addEventListener(
    "input",
    () => {

        bpmValue.textContent =
            bpmSlider.value;

        if (playing) {

            clearInterval(timer);

            startSequencer();

        }

    }
);

</script>

</body>
</html>
