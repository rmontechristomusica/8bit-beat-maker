<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>8-Bit Beat Maker V5</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: monospace;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 950px;
    margin: auto;
    background: #1b1b1b;
    border: 3px solid #444;
    border-radius: 15px;
    padding: 25px;
}

h1 {
    text-align: center;
    color: #00e5ff;
    letter-spacing: 3px;
}

h2 {
    text-align: center;
    color: #ffcc00;
    margin-top: 35px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 25px 0;
}

button {
    background: #00e5ff;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
}

.bpm {
    text-align: center;
    margin-bottom: 25px;
}

.row {
    display: grid;
    grid-template-columns: 100px repeat(8, 1fr);
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
}

.name {
    text-align: right;
    padding-right: 5px;
}

.cube {
    height: 45px;
    background: #292929;
    border: 2px solid #444;
    border-radius: 6px;
    cursor: pointer;
}

.cube.active {
    background: #00e5ff;
    border-color: white;
    box-shadow: 0 0 12px #00e5ff;
}

.cube.playing {
    outline: 3px solid white;
    transform: scale(1.08);
}

/* PIANO */

.piano-wrap {
    display: flex;
    justify-content: center;
    overflow-x: auto;
    padding: 10px 0;
}

.piano {
    position: relative;
    width: 650px;
    height: 190px;
    display: flex;
}

.white-key {
    width: 50px;
    height: 180px;
    background: white;
    color: black;
    border: 2px solid #222;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 10px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1;
}

.black-key {
    position: absolute;
    width: 32px;
    height: 110px;
    background: #111;
    color: white;
    border: 2px solid #555;
    border-radius: 0 0 5px 5px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 8px;
    font-size: 11px;
    cursor: pointer;
    z-index: 2;
}

.key.pressed {
    background: #00e5ff;
    color: black;
    box-shadow: 0 0 15px #00e5ff;
}

.black-key.pressed {
    background: #00e5ff;
}

.b1 { left: 34px; }
.b2 { left: 84px; }
.b3 { left: 184px; }
.b4 { left: 234px; }
.b5 { left: 284px; }
.b6 { left: 384px; }
.b7 { left: 434px; }
.b8 { left: 534px; }
.b9 { left: 584px; }

.footer {
    text-align: center;
    color: #777;
    margin-top: 20px;
}

@media (max-width: 600px) {
    .app { padding: 12px; }

    .row {
        grid-template-columns: 60px repeat(8, 1fr);
        gap: 4px;
    }

    .name { font-size: 10px; }
    .cube { height: 40px; }
}
</style>
</head>

<body>

<div class="app">

<h1>🎮 8-BIT BEAT MAKER V5</h1>

<div class="controls">
    <button id="playButton">▶ PLAY</button>
    <button id="saveButton">💾 SAVE</button>
    <button id="loadButton">📂 LOAD</button>
    <button id="clearButton">🗑️ CLEAR</button>
</div>

<div class="bpm">
    BPM:
    <input type="range" id="bpm" min="60" max="180" value="100">
    <span id="bpmValue">100</span>
</div>

<div class="sequencer">

<div class="row">
<div class="name">KICK</div>
<div class="cube" data-instrument="kick" data-step="0"></div>
<div class="cube" data-instrument="kick" data-step="1"></div>
<div class="cube" data-instrument="kick" data-step="2"></div>
<div class="cube" data-instrument="kick" data-step="3"></div>
<div class="cube" data-instrument="kick" data-step="4"></div>
<div class="cube" data-instrument="kick" data-step="5"></div>
<div class="cube" data-instrument="kick" data-step="6"></div>
<div class="cube" data-instrument="kick" data-step="7"></div>
</div>

<div class="row">
<div class="name">SNARE</div>
<div class="cube" data-instrument="snare" data-step="0"></div>
<div class="cube" data-instrument="snare" data-step="1"></div>
<div class="cube" data-instrument="snare" data-step="2"></div>
<div class="cube" data-instrument="snare" data-step="3"></div>
<div class="cube" data-instrument="snare" data-step="4"></div>
<div class="cube" data-instrument="snare" data-step="5"></div>
<div class="cube" data-instrument="snare" data-step="6"></div>
<div class="cube" data-instrument="snare" data-step="7"></div>
</div>

<div class="row">
<div class="name">HI-HAT</div>
<div class="cube" data-instrument="hihat" data-step="0"></div>
<div class="cube" data-instrument="hihat" data-step="1"></div>
<div class="cube" data-instrument="hihat" data-step="2"></div>
<div class="cube" data-instrument="hihat" data-step="3"></div>
<div class="cube" data-instrument="hihat" data-step="4"></div>
<div class="cube" data-instrument="hihat" data-step="5"></div>
<div class="cube" data-instrument="hihat" data-step="6"></div>
<div class="cube" data-instrument="hihat" data-step="7"></div>
</div>

<div class="row">
<div class="name">CLAP</div>
<div class="cube" data-instrument="clap" data-step="0"></div>
<div class="cube" data-instrument="clap" data-step="1"></div>
<div class="cube" data-instrument="clap" data-step="2"></div>
<div class="cube" data-instrument="clap" data-step="3"></div>
<div class="cube" data-instrument="clap" data-step="4"></div>
<div class="cube" data-instrument="clap" data-step="5"></div>
<div class="cube" data-instrument="clap" data-step="6"></div>
<div class="cube" data-instrument="clap" data-step="7"></div>
</div>

<div class="row">
<div class="name">TOM</div>
<div class="cube" data-instrument="tom" data-step="0"></div>
<div class="cube" data-instrument="tom" data-step="1"></div>
<div class="cube" data-instrument="tom" data-step="2"></div>
<div class="cube" data-instrument="tom" data-step="3"></div>
<div class="cube" data-instrument="tom" data-step="4"></div>
<div class="cube" data-instrument="tom" data-step="5"></div>
<div class="cube" data-instrument="tom" data-step="6"></div>
<div class="cube" data-instrument="tom" data-step="7"></div>
</div>

<div class="row">
<div class="name">BASS</div>
<div class="cube" data-instrument="bass" data-step="0"></div>
<div class="cube" data-instrument="bass" data-step="1"></div>
<div class="cube" data-instrument="bass" data-step="2"></div>
<div class="cube" data-instrument="bass" data-step="3"></div>
<div class="cube" data-instrument="bass" data-step="4"></div>
<div class="cube" data-instrument="bass" data-step="5"></div>
<div class="cube" data-instrument="bass" data-step="6"></div>
<div class="cube" data-instrument="bass" data-step="7"></div>
</div>

</div>

<h2>🎹 8-BIT PIANO</h2>

<div class="piano-wrap">
<div class="piano">

<div class="white-key key" data-note="261.63">C<br>A</div>
<div class="white-key key" data-note="293.66">D<br>S</div>
<div class="white-key key" data-note="329.63">E<br>D</div>
<div class="white-key key" data-note="349.23">F<br>F</div>
<div class="white-key key" data-note="392">G<br>G</div>
<div class="white-key key" data-note="440">A<br>H</div>
<div class="white-key key" data-note="493.88">B<br>J</div>
<div class="white-key key" data-note="523.25">C<br>K</div>

<div class="black-key key b1" data-note="277.18">C#<br>W</div>
<div class="black-key key b2" data-note="311.13">D#<br>E</div>
<div class="black-key key b3" data-note="369.99">F#<br>T</div>
<div class="black-key key b4" data-note="415.30">G#<br>Y</div>
<div class="black-key key b5" data-note="466.16">A#<br>U</div>

</div>
</div>

<div class="footer">
✦ KEYBOARD: A W S E D F T G Y H U J K ✦
</div>

</div>

<script>

let audioContext;
let playing = false;
let currentStep = 0;
let timer = null;

const pattern = {
    kick: Array(8).fill(false),
    snare: Array(8).fill(false),
    hihat: Array(8).fill(false),
    clap: Array(8).fill(false),
    tom: Array(8).fill(false),
    bass: Array(8).fill(false)
};

const cubes = document.querySelectorAll(".cube");
const pianoKeys = document.querySelectorAll(".key");

const playButton = document.getElementById("playButton");
const saveButton = document.getElementById("saveButton");
const loadButton = document.getElementById("loadButton");
const clearButton = document.getElementById("clearButton");
const bpmSlider = document.getElementById("bpm");
const bpmValue = document.getElementById("bpmValue");

function getAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === "suspended") audioContext.resume();
    return audioContext;
}

function noise(duration) {
    const ctx = getAudio();
    const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < data.length; i++) {
        data[i] = Math.random() * 2 - 1;
    }

    const source = ctx.createBufferSource();
    source.buffer = buffer;
    return source;
}

/* HIP-HOP KICK */
function kick() {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(150, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + 0.25);

    gain.gain.setValueAtTime(0.9, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.3);
}

/* SNARE */
function snare() {
    const ctx = getAudio();
    const source = noise(0.18);
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();

    filter.type = "highpass";
    filter.frequency.value = 900;

    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    source.start();
}

/* HI-HAT */
function hihat() {
    const ctx = getAudio();
    const source = noise(0.06);
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();

    filter.type = "highpass";
    filter.frequency.value = 7000;

    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    source.start();
}

/* CLAP */
function clap() {
    const ctx = getAudio();

    [0, 0.025, 0.05].forEach(function(delay) {
        const source = noise(0.05);
        const gain = ctx.createGain();

        gain.gain.setValueAtTime(0.2, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.06);

        source.connect(gain);
        gain.connect(ctx.destination);
        source.start(ctx.currentTime + delay);
    });
}

/* TOM */
function tom() {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(140, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.25);

    gain.gain.setValueAtTime(0.5, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.3);
}

/* BASS */
function bass() {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sawtooth";
    osc.frequency.value = 55;

    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.35);
}

/* PIANO */
function playNote(freq) {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.5);
}

pianoKeys.forEach(function(key) {
    key.addEventListener("click", function() {
        playNote(Number(key.dataset.note));
        key.classList.add("pressed");

        setTimeout(function() {
            key.classList.remove("pressed");
        }, 120);
    });
});

function triggerInstrument(instrument) {
    if (instrument === "kick") kick();
    if (instrument === "snare") snare();
    if (instrument === "hihat") hihat();
    if (instrument === "clap") clap();
    if (instrument === "tom") tom();
    if (instrument === "bass") bass();
}

cubes.forEach(function(cube) {
    cube.addEventListener("click", function() {
        const instrument = cube.dataset.instrument;
        const step = Number(cube.dataset.step);

        pattern[instrument][step] = !pattern[instrument][step];
        cube.classList.toggle("active");

        if (pattern[instrument][step]) {
            triggerInstrument(instrument);
        }
    });
});

function playStep() {

    cubes.forEach(function(cube) {
        cube.classList.remove("playing");
    });

    document.querySelectorAll(`[data-step="${currentStep}"]`).forEach(function(cube) {
        cube.classList.add("playing");
    });

    Object.keys(pattern).forEach(function(instrument) {
        if (pattern[instrument][currentStep]) {
            triggerInstrument(instrument);
        }
    });

    currentStep = (currentStep + 1) % 8;
}

function startSequencer() {
    const bpm = Number(bpmSlider.value);
    const interval = (60 / bpm) * 500;

    playStep();
    timer = setInterval(playStep, interval);
}

playButton.addEventListener("click", function() {

    getAudio();

    if (!playing) {
        playing = true;
        currentStep = 0;
        playButton.textContent = "■ STOP";
        startSequencer();
    } else {
        playing = false;
        clearInterval(timer);
        timer = null;
        playButton.textContent = "▶ PLAY";

        cubes.forEach(function(cube) {
            cube.classList.remove("playing");
        });
    }
});

bpmSlider.addEventListener("input", function() {
    bpmValue.textContent = bpmSlider.value;

    if (playing) {
        clearInterval(timer);
        startSequencer();
    }
});

/* SAVE */
saveButton.addEventListener("click", function() {
    localStorage.setItem("8bitBeatMakerV5", JSON.stringify({
        pattern: pattern,
        bpm: bpmSlider.value
    }));

    saveButton.textContent = "✓ SAVED";

    setTimeout(function() {
        saveButton.textContent = "💾 SAVE";
    }, 1200);
});

/* LOAD */
loadButton.addEventListener("click", function() {

    const saved = localStorage.getItem("8bitBeatMakerV5");

    if (!saved) {
        loadButton.textContent = "NO SAVE";

        setTimeout(function() {
            loadButton.textContent = "📂 LOAD";
        }, 1200);

        return;
    }

    const beat = JSON.parse(saved);

    Object.keys(pattern).forEach(function(instrument) {
        if (beat.pattern[instrument]) {
            pattern[instrument] = beat.pattern[instrument];
        }
    });

    bpmSlider.value = beat.bpm;
    bpmValue.textContent = beat.bpm;

    cubes.forEach(function(cube) {
        const instrument = cube.dataset.instrument;
        const step = Number(cube.dataset.step);

        cube.classList.toggle("active", pattern[instrument][step]);
    });

    loadButton.textContent = "✓ LOADED";

    setTimeout(function() {
        loadButton.textContent = "📂 LOAD";
    }, 1200);
});

/* CLEAR */
clearButton.addEventListener("click", function() {

    Object.keys(pattern).forEach(function(instrument) {
        pattern[instrument].fill(false);
    });

    cubes.forEach(function(cube) {
        cube.classList.remove("active");
    });
});

/* COMPUTER KEYBOARD */

const keyboardNotes = {
    a: 261.63,
    w: 277.18,
    s: 293.66,
    e: 311.13,
    d: 329.63,
    f: 349.23,
    t: 369.99,
    g: 392,
    y: 415.30,
    h: 440,
    u: 466.16,
    j: 493.88,
    k: 523.25
};

const heldKeys = new Set();

document.addEventListener("keydown", function(event) {

    const key = event.key.toLowerCase();

    if (!(key in keyboardNotes)) return;

    event.preventDefault();

    if (event.repeat || heldKeys.has(key)) return;

    heldKeys.add(key);

    playNote(keyboardNotes[key]);

    const pianoKey = Array.from(pianoKeys).find(function(element) {
        return Number(element.dataset.note) === keyboardNotes[key];
    });

    if (pianoKey) pianoKey.classList.add("pressed");
});

document.addEventListener("keyup", function(event) {

    const key = event.key.toLowerCase();

    if (!(key in keyboardNotes)) return;

    heldKeys.delete(key);

    const pianoKey = Array.from(pianoKeys).find(function(element) {
        return Number(element.dataset.note) === keyboardNotes[key];
    });

    if (pianoKey) pianoKey.classList.remove("pressed");
});

window.addEventListener("blur", function() {
    heldKeys.clear();

    pianoKeys.forEach(function(key) {
        key.classList.remove("pressed");
    });
});

</script>

</body>
</html>
