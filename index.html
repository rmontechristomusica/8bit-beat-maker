<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>8-Bit Beat Maker V3</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 850px;
            background: #1b1b1b;
            border: 3px solid #444;
            border-radius: 15px;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #00e5ff;
            letter-spacing: 3px;
            margin-top: 0;
        }

        h2 {
            text-align: center;
            color: #ffcc00;
            margin-top: 35px;
        }

        .controls {
            text-align: center;
            margin: 25px 0;
        }

        button {
            background: #00e5ff;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-family: monospace;
            font-size: 18px;
            cursor: pointer;
        }

        .bpm {
            text-align: center;
            margin-bottom: 30px;
        }

        input {
            width: 180px;
        }

        .sequencer {
            width: 100%;
        }

        .row {
            display: grid;
            grid-template-columns: 100px repeat(8, 1fr);
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }

        .name {
            font-size: 14px;
            text-align: right;
            padding-right: 5px;
        }

        .cube {
            height: 50px;
            background: #292929;
            border: 2px solid #444;
            border-radius: 6px;
            cursor: pointer;
        }

        .cube.active {
            background: #00e5ff;
            border-color: white;
            box-shadow: 0 0 12px #00e5ff;
        }

        .cube.playing {
            outline: 3px solid white;
            transform: scale(1.08);
        }

        .piano {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 4px;
            flex-wrap: wrap;
        }

        .key {
            width: 75px;
            height: 180px;
            background: white;
            color: black;
            border: 3px solid #222;
            border-radius: 0 0 8px 8px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .key.pressed {
            background: #00e5ff;
            transform: translateY(5px);
            box-shadow: 0 0 15px #00e5ff;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .app {
                padding: 15px;
            }

            h1 {
                font-size: 20px;
            }

            .row {
                grid-template-columns: 70px repeat(8, 1fr);
                gap: 5px;
            }

            .cube {
                height: 42px;
            }

            .name {
                font-size: 11px;
            }

            .key {
                width: 38px;
                height: 130px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🎮 8-BIT BEAT MAKER</h1>

    <div class="controls">
        <button id="playButton">▶ PLAY</button>
    </div>

    <div class="bpm">
        BPM:
        <input type="range" id="bpm" min="60" max="180" value="120">
        <span id="bpmValue">120</span>
    </div>

    <div class="sequencer">

        <div class="row">
            <div class="name">KICK</div>
            <div class="cube" data-instrument="kick" data-step="0"></div>
            <div class="cube" data-instrument="kick" data-step="1"></div>
            <div class="cube" data-instrument="kick" data-step="2"></div>
            <div class="cube" data-instrument="kick" data-step="3"></div>
            <div class="cube" data-instrument="kick" data-step="4"></div>
            <div class="cube" data-instrument="kick" data-step="5"></div>
            <div class="cube" data-instrument="kick" data-step="6"></div>
            <div class="cube" data-instrument="kick" data-step="7"></div>
        </div>

        <div class="row">
            <div class="name">SNARE</div>
            <div class="cube" data-instrument="snare" data-step="0"></div>
            <div class="cube" data-instrument="snare" data-step="1"></div>
            <div class="cube" data-instrument="snare" data-step="2"></div>
            <div class="cube" data-instrument="snare" data-step="3"></div>
            <div class="cube" data-instrument="snare" data-step="4"></div>
            <div class="cube" data-instrument="snare" data-step="5"></div>
            <div class="cube" data-instrument="snare" data-step="6"></div>
            <div class="cube" data-instrument="snare" data-step="7"></div>
        </div>

        <div class="row">
            <div class="name">HI-HAT</div>
            <div class="cube" data-instrument="hihat" data-step="0"></div>
            <div class="cube" data-instrument="hihat" data-step="1"></div>
            <div class="cube" data-instrument="hihat" data-step="2"></div>
            <div class="cube" data-instrument="hihat" data-step="3"></div>
            <div class="cube" data-instrument="hihat" data-step="4"></div>
            <div class="cube" data-instrument="hihat" data-step="5"></div>
            <div class="cube" data-instrument="hihat" data-step="6"></div>
            <div class="cube" data-instrument="hihat" data-step="7"></div>
        </div>

    </div>

    <h2>🎹 8-BIT PIANO</h2>

    <div class="piano">
        <div class="key" data-note="261.63">C<br>A</div>
        <div class="key" data-note="293.66">D<br>S</div>
        <div class="key" data-note="329.63">E<br>D</div>
        <div class="key" data-note="349.23">F<br>F</div>
        <div class="key" data-note="392">G<br>G</div>
        <div class="key" data-note="440">A<br>H</div>
        <div class="key" data-note="493.88">B<br>J</div>
        <div class="key" data-note="523.25">C<br>K</div>
    </div>

    <div class="footer">
        ✦ PLAY WITH A S D F G H J K ✦
    </div>

</div>

<script>

let audioContext;
let playing = false;
let currentStep = 0;
let timer = null;

const pattern = {
    kick: Array(8).fill(false),
    snare: Array(8).fill(false),
    hihat: Array(8).fill(false)
};

const cubes = document.querySelectorAll(".cube");
const playButton = document.getElementById("playButton");
const bpmSlider = document.getElementById("bpm");
const bpmValue = document.getElementById("bpmValue");
const pianoKeys = document.querySelectorAll(".key");


function getAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    return audioContext;
}


function kick() {
    const ctx = getAudio();
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = "square";
    oscillator.frequency.setValueAtTime(140, ctx.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(
        50,
        ctx.currentTime + 0.12
    );

    gain.gain.setValueAtTime(0.5, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.01,
        ctx.currentTime + 0.15
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.15);
}


function snare() {
    const ctx = getAudio();
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = "square";
    oscillator.frequency.value = 180;

    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.01,
        ctx.currentTime + 0.1
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.1);
}


function hihat() {
    const ctx = getAudio();
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = "square";
    oscillator.frequency.value = 700;

    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.01,
        ctx.currentTime + 0.04
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.04);
}


function playNote(frequency) {
    const ctx = getAudio();
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = "square";
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.01,
        ctx.currentTime + 0.5
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.5);
}


pianoKeys.forEach(function(key) {
    key.addEventListener("click", function() {

        const frequency = Number(key.dataset.note);

        playNote(frequency);

        key.classList.add("pressed");

        setTimeout(function() {
            key.classList.remove("pressed");
        }, 120);

    });
});


cubes.forEach(function(cube) {
    cube.addEventListener("click", function() {

        const instrument = cube.dataset.instrument;
        const step = Number(cube.dataset.step);

        pattern[instrument][step] =
            !pattern[instrument][step];

        cube.classList.toggle("active");

        if (pattern[instrument][step]) {

            if (instrument === "kick") kick();
            if (instrument === "snare") snare();
            if (instrument === "hihat") hihat();

        }

    });
});


function playStep() {

    cubes.forEach(function(cube) {
        cube.classList.remove("playing");
    });

    document
        .querySelectorAll(`[data-step="${currentStep}"]`)
        .forEach(function(cube) {
            cube.classList.add("playing");
        });

    if (pattern.kick[currentStep]) kick();
    if (pattern.snare[currentStep]) snare();
    if (pattern.hihat[currentStep]) hihat();

    currentStep++;

    if (currentStep >= 8) {
        currentStep = 0;
    }

}


function startSequencer() {

    const bpm = Number(bpmSlider.value);

    const interval = (60 / bpm) * 500;

    playStep();

    timer = setInterval(
        playStep,
        interval
    );

}


playButton.addEventListener("click", function() {

    getAudio();

    if (!playing) {

        playing = true;
        currentStep = 0;

        playButton.textContent = "■ STOP";

        startSequencer();

    } else {

        playing = false;

        clearInterval(timer);

        timer = null;

        playButton.textContent = "▶ PLAY";

        cubes.forEach(function(cube) {
            cube.classList.remove("playing");
        });

    }

});


bpmSlider.addEventListener("input", function() {

    bpmValue.textContent = bpmSlider.value;

    if (playing) {

        clearInterval(timer);

        startSequencer();

    }

});


/* COMPUTER KEYBOARD PIANO */

const keyboardNotes = {
    a: 261.63,
    s: 293.66,
    d: 329.63,
    f: 349.23,
    g: 392,
    h: 440,
    j: 493.88,
    k: 523.25
};

const heldKeys = new Set();


document.addEventListener("keydown", function(event) {

    const keyPressed = event.key.toLowerCase();

    if (!(keyPressed in keyboardNotes)) return;

    event.preventDefault();

    if (event.repeat || heldKeys.has(keyPressed)) return;

    heldKeys.add(keyPressed);

    playNote(keyboardNotes[keyPressed]);

    const pianoKey = Array.from(pianoKeys).find(
        function(key) {
            return Number(key.dataset.note) === keyboardNotes[keyPressed];
        }
    );

    if (pianoKey) {
        pianoKey.classList.add("pressed");
    }

});


document.addEventListener("keyup", function(event) {

    const keyPressed = event.key.toLowerCase();

    if (!(keyPressed in keyboardNotes)) return;

    event.preventDefault();

    heldKeys.delete(keyPressed);

    const pianoKey = Array.from(pianoKeys).find(
        function(key) {
            return Number(key.dataset.note) === keyboardNotes[keyPressed];
        }
    );

    if (pianoKey) {
        pianoKey.classList.remove("pressed");
    }

});


window.addEventListener("blur", function() {

    heldKeys.clear();

    pianoKeys.forEach(function(key) {
        key.classList.remove("pressed");
    });

});

</script>

</body>
</html>
